server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /hubs/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { try_files $uri /index.html; }
  # Hashed Vite bundles are immutable; the SPA shell must always revalidate
  # so deploys reach clients instead of serving stale asset references.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { expires -1; add_header Cache-Control "no-store"; }
}
