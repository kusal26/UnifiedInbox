services:
  postgres:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: unified_inbox, POSTGRES_USER: unified_inbox, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}, APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local_only_app_password} }
    volumes: [postgres-data:/var/lib/postgresql/data, ./db/init:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: [CMD-SHELL, pg_isready -U unified_inbox], interval: 5s, timeout: 5s, retries: 20 }
  rabbitmq:
    image: rabbitmq:4-management-alpine
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck: { test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 5s, retries: 20 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}, MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin} }
    ports: ["9000:9000"]
    volumes: [minio-data:/data]
    healthcheck: { test: [CMD, mc, ready, local], interval: 5s, timeout: 5s, retries: 20 }
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
  clamav:
    image: mkodockx/docker-clamav:alpine
    volumes: [clamav-data:/store]
  migrator:
    build: { context: ., dockerfile: src/backend/UnifiedInbox.Api/Dockerfile }
    command: ["dotnet", "UnifiedInbox.Api.dll", "--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: Host=postgres;Database=unified_inbox;Username=unified_inbox;Password=${POSTGRES_PASSWORD:-local_only_password}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Credentials__MasterKey: ${CREDENTIAL_MASTER_KEY}
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: src/backend/UnifiedInbox.Api/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: Host=postgres;Database=unified_inbox;Username=app_runtime;Password=${APP_DB_PASSWORD:-local_only_app_password}
      RabbitMq__Connection: amqp://guest:guest@rabbitmq:5672/
      Redis__Connection: redis:6379
      Jwt__Issuer: unified-inbox
      Jwt__Audience: unified-inbox-web
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Credentials__MasterKey: ${CREDENTIAL_MASTER_KEY}
      WhatsApp__AppId: ${WHATSAPP_APP_ID:-}
      WhatsApp__EmbeddedSignupConfigId: ${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      WhatsApp__EmbeddedSignupVersion: ${WHATSAPP_EMBEDDED_SIGNUP_VERSION:-v4}
      WhatsApp__AppSecret: ${WHATSAPP_APP_SECRET:-}
      WhatsApp__VerifyToken: ${WHATSAPP_VERIFY_TOKEN:-development-verify-token}
      Storage__Endpoint: http://minio:9000
      Storage__PresignEndpoint: ${STORAGE_PRESIGN_ENDPOINT:-http://localhost:9000}
      Storage__Bucket: ${STORAGE_BUCKET:-attachments}
      Storage__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      Storage__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      Storage__UseSsl: "false"
      ClamAv__Host: clamav
      ClamAv__Port: 3310
      Mail__SmtpHost: mailpit
      Mail__SmtpPort: 1025
      Mail__From: ${MAIL_FROM:-no-reply@unifiedinbox.local}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, migrator: { condition: service_completed_successfully } }
  worker:
    build: { context: ., dockerfile: src/backend/UnifiedInbox.Worker/Dockerfile }
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: Host=postgres;Database=unified_inbox;Username=app_runtime;Password=${APP_DB_PASSWORD:-local_only_app_password}
      RabbitMq__Connection: amqp://guest:guest@rabbitmq:5672/
      Credentials__MasterKey: ${CREDENTIAL_MASTER_KEY}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      WhatsApp__UseFake: ${WHATSAPP_USE_FAKE:-true}
      WhatsApp__AppId: ${WHATSAPP_APP_ID:-}
      WhatsApp__EmbeddedSignupConfigId: ${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      WhatsApp__AppSecret: ${WHATSAPP_APP_SECRET:-}
      WhatsApp__VerifyToken: ${WHATSAPP_VERIFY_TOKEN:-development-verify-token}
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: ${STORAGE_BUCKET:-attachments}
      Storage__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      Storage__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      Storage__UseSsl: "false"
      ClamAv__Host: clamav
      ClamAv__Port: 3310
      Mail__SmtpHost: mailpit
      Mail__SmtpPort: 1025
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy }, migrator: { condition: service_completed_successfully } }
  frontend:
    build: { context: ., dockerfile: src/frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]

volumes: { postgres-data: {}, rabbitmq-data: {}, redis-data: {}, minio-data: {}, clamav-data: {} }
